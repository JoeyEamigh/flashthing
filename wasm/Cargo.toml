[package]
name = "flashthing-wasm"
version = "0.5.0"
edition = "2024"
description = "webusb bindings for flashthing"
repository = "https://github.com/JoeyEamigh/flashthing.git"
documentation = "https://github.com/JoeyEamigh/flashthing"
homepage = "https://github.com/JoeyEamigh/flashthing"
keywords = ["spotify", "car-thing", "flashthing"]
readme = "../README.md"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
flashthing = { version = "0.5.0", path = "../lib" }
js-sys = "0.3.103"
serde_json = "1.0.151"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "registry"] }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["console"] }
